[package]
authors = ["mikialex <miikiialexx@gmail.com>"]
edition = "2024"
name = "rendiation-shader-api-testing"
version = "0.1.0"

# All the tests are unit tests of this crate, so the normal build of this crate is empty and never
# affects the compile time of other crates. Only the GPU execution tests require a GPU adapter.
[dev-dependencies]
rendiation-shader-api = { path = "../api" }
rendiation-shader-backend-naga = { path = "../backends/naga" }
rendiation-webgpu = { path = "../../platform/graphics/webgpu" }
pollster = { workspace = true }
naga = { workspace = true }
parking_lot = { workspace = true }
wgpu-types = { workspace = true }

[lints]
workspace = true
