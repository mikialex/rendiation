[package]
authors = ["MikiAlex <miikiialexx@gmail.com>"]
edition = "2024"
name = "viewer-content-api"
version = "0.1.0"

[lib]
# rlib is for the examples
crate-type = ["cdylib", "rlib"]


[dependencies]
env_logger = { workspace = true }
futures = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
fast-hash-collection = { workspace = true }
rendiation-viewer-content = { workspace = true }

# this dep declare is necessary as we are export c type from it
rendiation-texture-gpu-process = { workspace = true }
rendiation-dynamic-bvh-scene = { workspace = true }
rendiation-webgpu = { workspace = true }
rendiation-webgpu-frame = { workspace = true }
wgpu-types = { workspace = true }
ordered-float = "4.6"

database = { workspace = true }
database-ffi = { workspace = true }
database-tracing = { workspace = true }
viewer-content-api-trace-info = { workspace = true }

serde = { workspace = true }
rmp-serde = { workspace = true }

mimalloc = { version = "0.1.52", optional = true }

[build-dependencies]
cbindgen = "0.29.2"

[features]
default = ["extra-checks", "mimalloc"]
extra-checks = ["rendiation-viewer-content/extra-checks"]
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
