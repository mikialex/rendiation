[package]
authors = ["MikiAlex <miikiialexx@gmail.com>"]
edition = "2024"
name = "rendiation-viewer"
version = "0.1.0"

default-run = "rendiation-viewer"

[dependencies]
bytemuck = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true, features = ["thread-pool"] }

rand = { workspace = true }

database = { workspace = true }
database-tracing = { workspace = true }
viewer-content-api-trace-info = { workspace = true }
dirs = "4.0.0"
parking_lot = { workspace = true }
fast-hash-collection = { workspace = true }
heap-tools = { workspace = true }
image = "*"
disqualified = { workspace = true }
serde = { workspace = true }
facet = { workspace = true }
log = { workspace = true }
pin-project = { workspace = true }
humansize = { workspace = true }
png = "*"
rmp-serde = { workspace = true }
pollster = { workspace = true }
toml = { workspace = true }
event-source = { workspace = true }
rendiation-shader-api = { workspace = true }
rendiation-shader-library = { workspace = true }
rendiation-scene-rendering-gpu-base = { workspace = true }
rendiation-infinity-primitive = { workspace = true }
rendiation-animation = { workspace = true }
rendiation-algebra = { workspace = true }
rendiation-controller = { workspace = true }
rendiation-geometry = { workspace = true }
rendiation-parametric-rendering = { workspace = true }
rendiation-gizmo = { workspace = true }
rendiation-gui-3d = { workspace = true }
rendiation-lighting-punctual = { workspace = true }
rendiation-mesh-generator = { workspace = true }
rendiation-scene-geometry-query = { workspace = true }
rendiation-scene-gltf-exporter = { workspace = true }
rendiation-scene-gltf-loader = { workspace = true }
rendiation-scene-obj-loader = { workspace = true }
rendiation-mesh-simplification = { workspace = true }
rendiation-mesh-segmentation = { workspace = true }
rendiation-csg-sdf-expression = { workspace = true }
rendiation-texture-core = { workspace = true }
rendiation-texture-gpu-base = { workspace = true }
rendiation-texture-gpu-process = { workspace = true }
rendiation-texture-loader = { workspace = true }
rendiation-texture-exporter = { workspace = true }
rendiation-webgpu = { workspace = true }
rendiation-webgpu-frame = { workspace = true }
rendiation-viewer-content = { workspace = true, default-features = true }
rfd = "0.15.4"
tracing = { workspace = true }
tracing-subscriber = "0.3.20"
tracing-tracy = { version = "0.12.0", optional = true }
egui = { version = "0.34" }
egui-wgpu = { version = "0.34" }
egui-winit = { version = "0.34", default-features = false }
egui_extras = { version = "0.34" }
egui_tiles = "0.15.0"
winit = { workspace = true }

mimalloc = { version = "0.1.52", optional = true }
dhat = { version = "0.3.3", optional = true }


[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.77", features = ["Location", "UrlSearchParams"] }
console_log = "1"
wasm-bindgen = "=0.2.108" # the installed cli version must match this, so we lock it



[features]
default = ["heap-debug", "extra-checks", "mimalloc"]
extra-checks = ["rendiation-viewer-content/extra-checks"]
heap-debug = ["heap-tools/enabled"]
support-webgl = ["rendiation-webgpu/support-webgl"]
tracy = ["dep:tracing-tracy"]
tracy-heap-debug = ["tracy"]
mimalloc = ["dep:mimalloc"]
dhat-heap-profiling = ["dep:dhat"]

[lints]
workspace = true

[package.metadata.bundle]
name = "Rendiation Viewer"
identifier = "rendiation.viewer"
# cargo bundle not support relative path to cargo.toml, the cargo bundle cmd must run at project root
icon = ["application/viewer/assets/256x256@2x.png", "application/viewer/assets/256x256.png"]
category = "public.app-category.productivity"